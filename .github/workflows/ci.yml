name: ci
on:
  push:
  pull_request:
jobs:
  gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
          fallback: cargo-install
      - name: nextest
        run: cargo nextest run --workspace --all-targets
      - name: quarantine-105bit-release-info (non-blocking, does-not-gate-release)
        continue-on-error: true
        run: cargo nextest run --release -p graynfs-core --lib --run-ignored=only -E 'test(factors_105bit)'
      - name: release-build
        run: cargo build -p graynfs-cli --release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: wheel-pytest-gate
        run: |
          pip install maturin pytest
          maturin build --release --out wheels-ci
          $wheel = (Get-ChildItem wheels-ci/graynfs-*.whl | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          pip install --force-reinstall --no-deps $wheel
          python -m pytest -q python/tests
      - name: version-drift-guard
        run: python scripts/check_version.py
  gnfs-degrees-release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
          fallback: cargo-install
      - name: gnfs-degrees-release
        run: cargo nextest run --release -p graynfs-core --run-ignored=only -E 'test(cubic_gnfs|quartic_gnfs|wide_gnfs)'
