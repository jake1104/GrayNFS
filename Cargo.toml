[workspace]
members = [
    "crates/graynfs-core",
    "crates/graynfs-cli",
    "crates/graynfs-py",
    "crates/graynfs-bench",
]
resolver = "2"

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT"
authors = ["GrayNFS contributors"]

[workspace.dependencies]
num-bigint = "0.4"
num-traits = "0.2"
thiserror = "2.0"
rand = "0.9"
rand_chacha = "0.9"
smallvec = "1.15"
hashbrown = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
mimalloc = "0.1"
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py38"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
