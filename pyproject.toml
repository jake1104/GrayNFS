[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "graynfs"
version = "0.2.3"
description = "Adaptive integer factorization (Fermat, p-1/p+1, ECM, SIQS, GNFS) with Python bindings"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "GrayNFS contributors" }]
requires-python = ">=3.8"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security :: Cryptography",
]
dependencies = []

[project.urls]
Repository = "https://github.com/jake1104/GrayNFS"

[tool.maturin]
manifest-path = "crates/graynfs-py/Cargo.toml"
module-name = "graynfs._graynfs"
python-source = "python"
features = ["pyo3/extension-module"]
